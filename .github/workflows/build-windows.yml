name: Build MiniOBS for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check Python source
        run: python -m py_compile src/mini_obs.py

      - name: Build one-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiniOBS src/mini_obs.py

      - name: Prepare EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item dist/MiniOBS.exe build/MiniOBS.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MiniOBS.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MiniOBS-Windows-Installer
          path: installer/output/MiniOBS-Setup.exe
          if-no-files-found: error

      - name: Upload one-file EXE
        uses: actions/upload-artifact@v4
        with:
          name: MiniOBS-Windows-EXE
          path: build/MiniOBS.exe
          if-no-files-found: error
